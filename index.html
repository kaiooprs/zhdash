<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ZH</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://media-exp1.licdn.com/dms/image/C510BAQFMlxQmr6gYSw/company-logo_200_200/0?e=2159024400&v=beta&t=yODnRctkqD4CsjivGWc3EMr4U_vz5airDwzogM_0sA4">
    <link rel="manifest" href="/zhdash/manifest.json">
    <meta name="theme-color" content="#00adb5">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/zhdash/sw.js')
            .then(reg => console.log('Service Worker registrado com sucesso!', reg))
            .catch(err => console.log('Falha ao registrar o Service Worker:', err));
        });
      }
    </script>
</head>
<body>

    <div class="nav-central">
        <a href="#" id="link-kpi" class="link-card">📊 Acesso KPIs</a>
        <a href="https://dontpad.com/zhnotes" target="_blank" rel="noopener noreferrer" class="link-card">📝 Notas Rápidas</a>
    </div>

    <div class="container-principal">
        
        <div class="calculadora-container">
            <h1>Cálculo de Intervalo</h1>
            <label>Início (Hora : Min)</label>
            <div class="input-row">
                <input type="number" id="h_ini" placeholder="00">
                <input type="number" id="m_ini" placeholder="00">
            </div>
            <br>
            <label>Término (Hora : Min)</label>
            <div class="input-row">
                <input type="number" id="h_fim" placeholder="00">
                <input type="number" id="m_fim" placeholder="00">
            </div>
            <button onclick="calcularHoras()">Calcular Minutos</button>
            <div class="resultado-box">
                Total em Minutos:
                <h2 id="res_minutos">0</h2>
                <div id="res_formatado" class="label-pequena">Tempo: 0h 00min</div>
            </div>
        </div>

        <div class="calculadora-container">
            <h1>Consumo de Corte</h1>
            <div class="input-group">
                <label>Quantidade de Chapas</label>
                <input type="number" id="chapas" placeholder="0">
            </div>
            <div class="input-group">
                <label>Material (Corte)</label>
                <select id="material_corte">
                    <option data-multi="3.08" data-div="1.4">EVA</option>
                    <option data-multi="3" data-div="1.5">Espuma</option>
                    <option data-multi="2.7" data-div="1.5">Converse</option>
                    <option data-multi="1.8" data-div="1.5">Palmbox</option>
                </select>
            </div>
            <button onclick="calcularCorte()">Calcular</button>
            <div class="resultado-box">
                Resultado:
                <h2 id="resultado_corte">0.00</h2>
            </div>
        </div>

        <div class="calculadora-container">
            <h1>Consumo de C/H</h1>
            <div class="input-group">
                <label>Quantidade Usada</label>
                <input type="number" id="quantidade_consumo" placeholder="0">
            </div>
            <div class="input-group">
                <label>Material (Consumo)</label>
                <select id="material_consumo">
                    <option value="14.5">Cola (Lata)</option>
                    <option value="0.835">Halogênio (Unidade)</option>
                </select>
            </div>
            <button onclick="calcularConsumo()">Calcular</button>
            <div class="resultado-box">
                Peso Total (kg):
                <h2 id="resultado_consumo">0.000</h2>
            </div>
        </div>

        <div class="calculadora-container">
            <h1>Regra de 3</h1>
            <div class="regra3-grid">
                <div class="input-group">
                    <label>Se este valor (A)</label>
                    <input type="number" id="regra_a" placeholder="Ex: 10">
                </div>
                <div class="input-group">
                    <label>Está para (B)</label>
                    <input type="number" id="regra_b" placeholder="Ex: 100">
                </div>
                <div class="input-group">
                    <label>Assim como (C)</label>
                    <input type="number" id="regra_c" placeholder="Ex: 20">
                </div>
                <div class="input-group">
                    <label>Está para (X)</label>
                    <input type="text" value="?" disabled style="text-align: center; font-weight: bold; background: #eee;">
                </div>
            </div>
            <button onclick="calcularRegra3()">Calcular X</button>
            <div class="resultado-box">
                Valor de X:
                <h2 id="resultado_regra3">0.00</h2>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
